[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keepsake-memory"
version = "1.1.1"
description = "Keepsake — full-entry memory system for Hermes Agent. On-demand storage of complete memories with semantic search."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "j-zly"},
]
keywords = ["hermes-agent", "memory", "rag", "redisearch", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "redis>=5.0",
    "jieba>=0.42",
    # 英文词干化（Porter2）—— 纯 Python 实现，无模型下载、无外部服务。
    # 索引侧与查询侧共用同一个归一函数（见 keepsake/domain/splitter.py 的对称铁律）。
    "snowballstemmer>=2.2",
]

[project.optional-dependencies]
# PostgreSQL 后端（可选）。默认后端是 Redis —— 不用 PG 就别装，装了也不影响。
# 用法: pip install 'keepsake-memory[postgres]' + 配置 storage.backend = "postgres"
# 2026-10 ks_pg_pool：`pool` extra 是**连接池**（psycopg_pool）——
#   PG 后端现在用官方连接池（健康探测 / 空闲回收 / 死连接重建），
#   少了它单条持久连接坏了不自愈（2026-10-20 线上事故根因）。
postgres = ["psycopg[binary,pool]>=3.1"]
# 通用 MCP 服务（可选）。只有 `keepsake.mcp_server` / examples/mcp_client_demo.py 需要，
# 其余功能不装也能用（`mcp_server` 是 import 时才要 SDK）。
mcp = ["mcp>=1.2,<2"]

[tool.setuptools]
packages.find = {where = ["src"]}
include-package-data = true
