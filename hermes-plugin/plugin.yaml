name: keepsake
version: 2.0.0
description: "Keepsake — full-entry memory system for Hermes Agent. Complete memories stored as-is, per-turn semantic recall injected into context: BM25 out of the box, optional vector KNN, time decay, feedback ranking, two storage backends (PostgreSQL / SQLite), multi-agent governance."
author: "j-zly"
license: "MIT"
repository: "https://github.com/j-zly/keepsake"
homepage: "https://github.com/j-zly/keepsake#readme"
bugs: "https://github.com/j-zly/keepsake/issues"

requires_hermes: ">=0.21"
min_python_version: "3.10"

python_dependencies:
  - "keepsake-memory>=2.0.0"

external_services:
  - postgresql>=14    # storage.backend = "postgres"
  # sqlite needs nothing extra — it ships with Python.

capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env: []

optional_env:
  - name: KEEPSAKE_CONFIG
    description: Path to the JSON config file (default ~/.config/keepsake/config.json).
  - name: KEEPSAKE_AGENT_ID
    description: Multi-agent deployments — identity of this agent (stored memories are tagged with it).
  - name: KEEPSAKE_IS_PRIMARY
    description: Multi-agent deployments — "true" marks the primary agent (reads across all agents' memories).

features:
  - automatic_per_turn_recall
  - full_entry_storage
  - bm25_fulltext_search
  - optional_vector_knn
  - time_decay_and_feedback_ranking
  - multi_backend_postgres_sqlite
  - multi_agent_governance
  - knowledge_base_tools
  - memory_tiering_review_pipeline

tags:
  - memory
  - postgresql
  - rag
  - multi-agent

supported_platforms:
  - linux
  - macos

warnings:
  - "Requires a storage backend you run yourself: PostgreSQL (with pgvector for KNN) or the embedded SQLite file. There is no default backend — storage.backend must be set explicitly. The Redis backend was removed in 2.0.0."
  - "Optional vector search needs an embedding endpoint (OpenAI-compatible API or local Ollama). BM25 recall works with no external API at all."
